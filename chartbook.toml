[project]
name = "SPX Options"
description = "Leverage-adjusted SPX option portfolio returns following CJS (2013) and HKM (2017)"
contributors = [
    "Jeremy Bejarano",
    "Tobias Rodriguez del Pozo",
]
repo_url = "https://github.com/ftsfr/options"
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]

[notebooks.summary_options]
name = "summary_options"
description = "Summary statistics and visualization of SPX option portfolio returns"
path = "_output/summary_options.ipynb"
publishable = true

[dataframes.ftsfr_hkm_option_returns]
name = "ftsfr_hkm_option_returns"
description = "HKM (2017) 18 leverage-adjusted SPX option portfolio monthly returns"
sources = [
    "OptionMetrics",
]
providers = [
    "WRDS",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu/",
]
tags = [
    "options",
    "SPX",
    "returns",
    "HKM",
]
access_types = [
    "WRDS Subscription",
]
license = "WRDS"
restrictions = "No"
pull_method = "Pulled from WRDS OptionMetrics database"
path = "./_data/ftsfr_hkm_option_returns.parquet"
date_col = "ds"
docs = """
## HKM Option Portfolio Returns

Monthly leverage-adjusted returns for 18 SPX option portfolios following He, Kelly, Manela (2017).

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Portfolio identifier (e.g., hkm_C_1000 = call, ATM) |
| ds | Month-end date |
| y | Monthly leverage-adjusted return |

### Portfolio Construction

- 18 portfolios = 9 moneyness levels x 2 option types (call/put)
- Moneyness: 0.90, 0.925, 0.95, 0.975, 1.0, 1.025, 1.05, 1.075, 1.10
- Returns averaged across 30, 60, 90-day maturities

### Data Source

WRDS OptionMetrics (SPX options, secid=108105)
"""

[dataframes.ftsfr_cjs_option_returns]
name = "ftsfr_cjs_option_returns"
description = "CJS (2013) 54 leverage-adjusted SPX option portfolio monthly returns"
sources = [
    "OptionMetrics",
]
providers = [
    "WRDS",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu/",
]
tags = [
    "options",
    "SPX",
    "returns",
    "CJS",
]
access_types = [
    "WRDS Subscription",
]
license = "WRDS"
restrictions = "No"
pull_method = "Pulled from WRDS OptionMetrics database"
path = "./_data/ftsfr_cjs_option_returns.parquet"
date_col = "ds"
docs = """
## CJS Option Portfolio Returns

Monthly leverage-adjusted returns for 54 SPX option portfolios following Constantinides, Jackwerth, Savov (2013).

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Portfolio identifier (e.g., cjs_C_1000_30 = call, ATM, 30-day) |
| ds | Month-end date |
| y | Monthly leverage-adjusted return |

### Portfolio Construction

- 54 portfolios = 9 moneyness x 3 maturities x 2 option types
- Moneyness: 0.90, 0.925, 0.95, 0.975, 1.0, 1.025, 1.05, 1.075, 1.10
- Maturities: 30, 60, 90 days

### Data Filtration

Following CJS (2013) Appendix B:
- Level 1: Remove duplicates, zero bids
- Level 2: DTM 7-180 days, IV 5-100%, moneyness 0.8-1.2
- Level 3: IV outlier filter, put-call parity filter

### Data Source

WRDS OptionMetrics (SPX options, secid=108105)
"""

